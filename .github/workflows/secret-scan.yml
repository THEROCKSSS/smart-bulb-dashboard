name: Secret scan

# W2-220: .gitignore is a default, not a control. `git add -f` bypasses it
# silently, and a file tracked before the ignore rule existed stays tracked.
# This job looks at what is actually committed. It runs on every push and PR
# with no path filter on purpose -- a secret can land in any file.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stdlib only, so there is nothing to install and nothing to pin.
      - name: Scan tracked files for committed secrets
        run: python .github/scripts/scan_secrets.py
