<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Bulb Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand">Smart<span class="accent">Bulb</span></div>
    <span id="status-badge" class="status-badge">
      <span class="dot"></span><span id="status-text">connecting…</span>
    </span>
    <div class="device-picker">
      <select id="device-select"></select>
    </div>
  </div>

  <!-- Icon rail: collapsed to glyphs, widens on hover (and on keyboard focus,
       so it isn't pointer-only). Labels stay in the DOM for screen readers. -->
  <div class="sidebar" id="sidebar">
    <div class="nav-item" data-route="light"><span class="nav-ic" aria-hidden="true">◐</span><span class="nav-lb">Light</span></div>
    <div class="nav-item" data-route="audio"><span class="nav-ic" aria-hidden="true">◎</span><span class="nav-lb">Audio</span></div>
    <div class="nav-item" data-route="automation"><span class="nav-ic" aria-hidden="true">◷</span><span class="nav-lb">Automation</span></div>
    <div class="nav-item" data-route="rooms"><span class="nav-ic" aria-hidden="true">▦</span><span class="nav-lb">Rooms</span></div>
    <div class="nav-item" data-route="system"><span class="nav-ic" aria-hidden="true">⚙</span><span class="nav-lb">System</span></div>
  </div>

  <!-- Always-visible quick control, independent of which page is open. -->
  <aside class="quickctl" id="quickctl"></aside>

  <div class="main" id="main"></div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<div class="pin-gate-overlay" id="pin-gate-overlay" style="display:none;">
  <div class="pin-gate-box">
    <h2>Enter PIN</h2>
    <p class="panel-subtitle">This dashboard is configured to require a PIN before use (remote-access mode).</p>
    <input type="password" id="pin-input" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <button id="pin-submit" class="primary">Unlock</button>
    <p class="panel-subtitle" id="pin-error" style="color:var(--danger);"></p>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
