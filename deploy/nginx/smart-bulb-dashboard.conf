# Smart Bulb Dashboard -- nginx reverse proxy (W2-032/033/034/037/039/045/048/049).
#
# The alternative to deploy/caddy/Caddyfile for people who already run
# nginx. It does the same job, but certificate issuance and renewal are
# NOT automatic here -- that is certbot's job and you have to set it up.
# See README.md in this directory for the exact renewal automation and how
# to prove it works before the first 90-day expiry catches you out.
#
# Install (Debian/Ubuntu):
#     sudo cp smart-bulb-dashboard.conf /etc/nginx/conf.d/
#     sudo nginx -t && sudo systemctl reload nginx
#
# This file belongs in conf.d/ (or another directory included from the
# `http` block), NOT inside an existing `server { }` -- the limit_req_zone
# and map directives below are only valid at http level.
#
# Replace `yourname.duckdns.org` throughout before use.

# --- W2-039: rate limiting in front of the app's own lockout ---------------
# $binary_remote_addr is nginx's view of the peer. If another proxy sits in
# front of this one (Cloudflare, a load balancer), that is the *upstream's*
# address and this limiter degrades to throttling everyone at once -- set
# up real_ip_header/set_real_ip_from below first so it sees actual clients.
#
# 10r/m on login is generous next to a human (nobody types six PINs a
# minute) and brutal next to a brute force. burst=5 nodelay lets a person
# fumbling their PIN through a couple of quick retries without a 503.
limit_req_zone $binary_remote_addr zone=sbd_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sbd_general:10m rate=30r/s;

# --- W2-037: WebSocket/SSE upgrade plumbing -------------------------------
# The dashboard is plain request/response today (it polls). This is here so
# that when a live-updating feature does land, it does not arrive together
# with a day of debugging why the connection closes after 60s behind the
# proxy -- the failure mode is silent and non-obvious.
map $http_upgrade $sbd_connection_upgrade {
	default upgrade;
	''      close;
}

# --- W2-045: proxy-layer access log ---------------------------------------
# Includes the upstream status and response time, so repeated 401s from one
# address are greppable at the proxy without reading the app's audit log:
#   awk '$9 == 401 {print $1}' /var/log/nginx/smart-bulb-dashboard.access.log \
#     | sort | uniq -c | sort -rn
log_format sbd_combined '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'upstream=$upstream_status rt=$request_time urt=$upstream_response_time';

# --- plaintext: ACME challenge + redirect ---------------------------------
server {
	listen 80;
	listen [::]:80;
	server_name yourname.duckdns.org;

	# Must stay on plain HTTP and must NOT be redirected: this is how
	# certbot proves domain control, at issuance and at every renewal.
	# Redirecting it is the single most common reason an nginx renewal
	# silently starts failing months after a working setup.
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 308 https://$host$request_uri;
	}
}

# --- TLS ------------------------------------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# W2-048: HTTP/2. Separate directive since nginx 1.25.1; on older
	# builds delete this line and write `listen 443 ssl http2;` above
	# instead (nginx will refuse to start on a version mismatch, so you
	# will find out immediately rather than silently serving HTTP/1.1).
	# Verify with: curl -sI --http2 https://yourname.duckdns.org/healthz
	http2 on;
	server_name yourname.duckdns.org;

	ssl_certificate     /etc/letsencrypt/live/yourname.duckdns.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/yourname.duckdns.org/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SBD_SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	access_log /var/log/nginx/smart-bulb-dashboard.access.log sbd_combined;
	error_log  /var/log/nginx/smart-bulb-dashboard.error.log;

	# W2-034. Only ever reaches a browser over HTTPS, so it cannot affect
	# anyone still using plain HTTP. Leave the app's SBD_HSTS off when this
	# is set, so there is exactly one source of truth. includeSubDomains is
	# omitted deliberately -- see the note in ../caddy/Caddyfile.
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;

	# W2-049: nothing this API accepts is large.
	client_max_body_size 1m;

	limit_req zone=sbd_general burst=60 nodelay;

	# W2-044: the dedicated infrastructure probe, not /api/system/health.
	# Kept out of the access log so a 30-second health check does not bury
	# the 401s you actually want to see in there.
	location = /healthz {
		access_log off;
		proxy_pass http://127.0.0.1:8500;
		proxy_set_header Host $host;
	}

	location = /api/auth/login {
		limit_req zone=sbd_login burst=5 nodelay;
		limit_req_status 429;

		proxy_pass http://127.0.0.1:8500;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host  $host;
	}

	location / {
		proxy_pass http://127.0.0.1:8500;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		# $proxy_add_x_forwarded_for APPENDS $remote_addr to whatever the
		# client sent, so a client forging "X-Forwarded-For: 9.9.9.9"
		# arrives as "9.9.9.9, <their real ip>". The backend walks this
		# right-to-left for exactly that reason and only believes it at all
		# when SBD_TRUSTED_PROXIES names this proxy. If you would rather
		# not rely on that, use `$remote_addr` here instead to overwrite
		# the client's value outright -- both work with the backend.
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host  $host;

		# W2-037: pass through WebSocket/SSE upgrades, and do not buffer or
		# time out a long-lived stream.
		proxy_http_version 1.1;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $sbd_connection_upgrade;
		proxy_buffering off;
		proxy_read_timeout 3600s;
	}
}

# --- If ANOTHER proxy sits in front of this nginx -------------------------
# Uncomment and set to that proxy's address, otherwise $remote_addr (and
# therefore both limit_req zones above, and the X-Forwarded-For nginx
# appends) refer to the upstream proxy rather than to real clients:
#
#     set_real_ip_from 10.0.0.0/8;
#     real_ip_header   X-Forwarded-For;
#     real_ip_recursive on;
#
# The dashboard MUST also run with SBD_TRUSTED_PROXIES naming this nginx
# (e.g. SBD_TRUSTED_PROXIES=127.0.0.1,::1 when it proxies to localhost).
# Without it the backend ignores every header above and keys its per-IP
# lockout to the proxy, so one attacker locks out every remote user.
# Verify after deploying:
#     curl -s https://yourname.duckdns.org/api/system/proxy-status | jq
# `client_ip` must be your real address, not 127.0.0.1.
