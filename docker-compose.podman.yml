# Podman override for smart-bulb-dashboard. Layered on docker-compose.yml AND
# docker-compose.windows.yml (it must come last of the three).
#
# Host port 127.0.0.1:8502 -> 127.0.0.1:8504.
#
# 8502 cannot be bound by a container any more. `tailscale serve` publishes
# https://owens-pc-vpn.tailff2683.ts.net:8502 and tailscaled holds that port;
# with WSL mirrored networking the container is on the host's real interfaces,
# so the two now collide where under Docker Desktop's NAT they did not:
#
#   rootlessport listen tcp 127.0.0.1:8502: bind: address already in use
#
# Verified as a general rule, not a guess: binding 8501 and 8502 (both
# `tailscale serve` ports) fails, while 8555 succeeds.
#
# ---------------------------------------------------------------------------
# DONE — no further action needed. The serve mapping was repointed with:
#
#   tailscale serve --bg --https=8502 http://127.0.0.1:8504
#
# so the URL people actually use is unchanged. Verified 2026-08-10:
#
#   tailscale serve status
#     https://owens-pc-vpn.tailff2683.ts.net:8502 -> proxy http://127.0.0.1:8504
#
#   GET https://owens-pc-vpn.tailff2683.ts.net:8502/healthz -> 200 {"status":"ok"}
#
# If that mapping is ever lost, the symptom is a dead tailnet URL while
# http://127.0.0.1:8504 still works — re-run the command above to fix it.
#
# 8503 is untouched — nothing else claims it.

services:
  smart-bulb-dashboard:
    ports: !override
      - "127.0.0.1:8504:8500"
      - "127.0.0.1:8503:8503"
